[pytest]
testpaths = tests
addopts = -ra --strict-markers
# A test marked xfail that starts passing (XPASS) FAILS the run. This is deliberate:
# when a defect is fixed upstream, the test must be promoted to a normal test.
xfail_strict = true
markers =
    issue(id): links a test to a numbered finding in issues/ (e.g. ISSUE-001)
